services:
  control-plane:
    build:
      context: .
    environment:
      AEGIS_ENVIRONMENT: local
      AEGIS_LOG_LEVEL: INFO
      AEGIS_API_HOST: 0.0.0.0
      AEGIS_API_PORT: 8080
    init: true
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
